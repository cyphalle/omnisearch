[package]
name = "omnisearch"
version = "0.1.0"
edition = "2021"
description = "CLI multi-source search aggregator for Claude Code"
repository = "https://github.com/cyphalle/omnisearch"
license = "MIT"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# CLI
clap = { version = "4", features = ["derive"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# XML parsing (for arxiv, pubmed, etc.)
quick-xml = { version = "0.37", features = ["serialize"] }

# Error handling
thiserror = "2"
anyhow = "1"

# Async trait
async-trait = "0.1"

# Rate limiting
governor = "0.8"

# Time
chrono = { version = "0.4", features = ["serde"] }

# URL handling
url = "2"
urlencoding = "2"

# Colored terminal output
comfy-table = "7"
colored = "2"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Futures utilities
futures = "0.3"

# Hashing (cache keys)
sha2 = "0.10"

# Directories
dirs = "6"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
strip = true
